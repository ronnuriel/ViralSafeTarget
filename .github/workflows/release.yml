name: Build release artifacts

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build-and-smoke-test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip build twine
      - run: python -m build
      - run: python -m twine check dist/*
      - name: Install wheel outside checkout
        run: |
          cd "$(mktemp -d)"
          python -m venv smoke-env
          source smoke-env/bin/activate
          python -m pip install "$GITHUB_WORKSPACE"/dist/*.whl
          vst --version
          vst doctor --json
          vst quickstart --out demo-project
          vst plan demo-project/project.yaml --json
          vst run demo-project/project.yaml
          vst status demo-project/project.yaml
          vst open demo-project/results --no-browser
          vst export demo-project/project.yaml
      - uses: actions/upload-artifact@v4
        if: matrix.os == 'ubuntu-latest'
        with:
          name: viral-safe-target-distributions
          path: dist/*

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-and-smoke-test
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: viral-safe-target-distributions
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
