name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e .[dev]
      - run: ruff check src tests scripts
      - run: pytest
      - run: viral-safe-target scan --virus-alignment data/demo/virus_aligned.fasta --reference-id HSV2_demo_ref --gff data/demo/reference.gff3 --small-host-fasta data/demo/human_mini.fasta --out-dir reports/ci --min-coverage 0.8
