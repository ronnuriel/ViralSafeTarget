[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "viral-safe-target"
version = "0.4.0"
description = "Reproducible research toolkit for conserved viral genome target prioritization and sequence-level disruption simulation"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
  {name = "ViralSafeTarget contributors"}
]
keywords = ["bioinformatics", "viral genomics", "CRISPR", "off-target", "HSV"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
  "biopython>=1.83",
  "pandas>=2.1",
  "numpy>=1.26",
  "matplotlib>=3.8",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
notebooks = [
  "jupyterlab>=4.0",
  "nbformat>=5.9",
]
ui = [
  "streamlit>=1.38",
]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
]
torch = [
  "torch>=2.2",
]
all = [
  "jupyterlab>=4.0",
  "nbformat>=5.9",
  "streamlit>=1.38",
  "pytest>=8.0",
  "ruff>=0.6",
]

[project.scripts]
viral-safe-target = "viral_safe_target.cli:main"
vst = "viral_safe_target.cli:main"

[project.urls]
Homepage = "https://github.com/ronnuriel/ViralSafeTarget"
Documentation = "https://github.com/ronnuriel/ViralSafeTarget/tree/main/docs"
Issues = "https://github.com/ronnuriel/ViralSafeTarget/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
viral_safe_target = ["data/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
